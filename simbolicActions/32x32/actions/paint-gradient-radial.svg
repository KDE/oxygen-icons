<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <style id="current-color-scheme">.ColorScheme-Text{color:#232629}.ColorScheme-Highlight{color:#3daee9}</style>
    <radialGradient id="radial-fill">
      <stop class="ColorScheme-Text" offset="0" stop-color="currentColor" stop-opacity=".05"/>
      <stop class="ColorScheme-Text" offset="1" stop-color="currentColor" stop-opacity=".65"/>
    </radialGradient>
  </defs>
  <circle class="ColorScheme-Text" cx="16" cy="16" r="10.5" fill="url(#radial-fill)" stroke="currentColor"/>
  <circle class="ColorScheme-Highlight" cx="16" cy="16" r="1.5" fill="currentColor"/>
</svg>